# Explorar: el muro de publicaciones (Para ti y Siguiendo) y el buscador global
# (etiquetas, publicaciones, sin resultados y borrar).
#
# Datos: 20-inicio-explorar.sql (P1 «Lijado fino...», P2 con #TallerE2E).
appId: host.exp.exponent
name: "Explorar: muro y busqueda"
tags:
  - inicio-explorar
  - explorar
  - busqueda
---
- runFlow: ../_comun/abrir-app.yaml
- runFlow: ../_comun/iniciar-sesion.yaml
- runFlow:
    file: ../_comun/ir-a-pestana.yaml
    env:
      PESTANA: Explorar
- extendedWaitUntil:
    visible: "EXPLORAR"
    timeout: 20000

# ---- MURO: Para ti -----------------------------------------------------------
# P1 es la publicacion mas reciente de la siembra: tiene que salir en el muro.
- scrollUntilVisible:
    element: "Lijado fino antes del barniz: grano 320 y sin prisa."
    direction: DOWN
    timeout: 60000
    centerElement: true
- assertVisible: "Ver perfil de Beto Prueba"
# La fila de acciones con nombre debajo de cada icono.
- assertVisible: "Comentar"
- assertVisible: "Repostear"
- assertVisible: "Compartir"
- takeScreenshot: inicio-explorar-muro-para-ti

# P2: la etiqueta y la persona etiquetada se pintan como enlaces.
# Sin centerElement: con P2 ya a la vista en la mitad de abajo, el deslizamiento
# para centrarla se pasaba de largo, la dejaba por encima de la pantalla y
# Maestro seguia bajando hasta el final del muro sin volver (29-10).
- scrollUntilVisible:
    element: "Este sabado abrimos el taller a quien quiera venir #TallerE2E"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Con @beto_e2e"
    direction: DOWN
    timeout: 30000

# ---- MURO: Siguiendo -----------------------------------------------------------
# Ana sigue a Beto: en Siguiendo salen las de Beto y no las de quien no sigue.
# Se sube hasta las PESTAÑAS, no hasta el redactor: van encima de el, y el
# desplazamiento se para en cuanto el redactor entra entero, a veces con las
# pestañas unos px por encima de la vista (pasó con la tanda 2 de rendimiento,
# que cambia el ritmo al quitar el bucle de H-12). 120 s: desde P2 hacen falta
# 3-4 deslizamientos y, con la guia de Explorar a la vista tras auth/01, cada
# uno tarda ~20 s (29-10: con 60 s las pestañas aparecieron justo al agotarse).
- scrollUntilVisible:
    element: "Siguiendo"
    direction: UP
    timeout: 120000
- tapOn:
    text: "Siguiendo"
    index: 0
- scrollUntilVisible:
    element: "Lijado fino antes del barniz: grano 320 y sin prisa."
    direction: DOWN
    timeout: 60000
- takeScreenshot: inicio-explorar-muro-siguiendo
- scrollUntilVisible:
    element: "Para ti"
    direction: UP
    timeout: 120000
- tapOn:
    text: "Para ti"
    index: 0

# ---- BUSQUEDA --------------------------------------------------------------------
# El teclado del emulador (Gboard) a veces mete una letra de su sugerencia: el
# 29-10 escribio «TallerE2KE» y la app busco eso. Si el campo no dice
# exactamente lo escrito, se borra con la «x» (borrar letra a letra es muy
# lento aqui) y se escribe otra vez.
- tapOn: "Personas, publicaciones, cursos o eventos..."
- inputText: "TallerE2E"
- runFlow:
    when:
      notVisible: "TallerE2E"
    commands:
      - tapOn: "Borrar la búsqueda"
      - tapOn: "Personas, publicaciones, cursos o eventos..."
      - inputText: "TallerE2E"
- extendedWaitUntil:
    visible: "#TallerE2E"
    timeout: 15000
- assertVisible: "Etiquetas"
- assertVisible: "1 publicación"
- assertVisible: "Publicaciones"
- assertVisible: "Ver publicación de Ana Prueba"
- hideKeyboard
- takeScreenshot: inicio-explorar-busqueda-resultados

# La etiqueta del resultado abre su pantalla.
- tapOn: "#TallerE2E"
- extendedWaitUntil:
    visible: "Este sabado abrimos el taller a quien quiera venir #TallerE2E"
    timeout: 15000
- assertVisible: "1 publicación"
- back
- extendedWaitUntil:
    visible: "Ver publicación de Ana Prueba"
    timeout: 10000

# Sin resultados: lo dice con el termino buscado.
- tapOn: "Borrar la búsqueda"
- tapOn: "Personas, publicaciones, cursos o eventos..."
- inputText: "qzxwvkj"
- runFlow:
    when:
      notVisible: "qzxwvkj"
    commands:
      - tapOn: "Borrar la búsqueda"
      - tapOn: "Personas, publicaciones, cursos o eventos..."
      - inputText: "qzxwvkj"
- extendedWaitUntil:
    visible: "Sin resultados"
    timeout: 15000
- assertVisible: "No encontramos nada para «qzxwvkj»."
- hideKeyboard
- takeScreenshot: inicio-explorar-busqueda-vacia

# Borrar devuelve el muro.
- tapOn: "Borrar la búsqueda"
- extendedWaitUntil:
    visible: "Crear nueva publicación"
    timeout: 10000
- assertNotVisible: "Sin resultados"
