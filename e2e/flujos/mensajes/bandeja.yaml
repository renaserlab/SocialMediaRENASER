# Bandeja de Mensajes: las tres conversaciones sembradas, con su ultimo
# mensaje, el buscador (que filtra en el servidor) y el boton de crear grupo.
#
# Datos: e2e/datos/30-mensajes.sql (chat Ana–Beto, «Taller E2E»,
# «Carpinteria E2E»).
appId: host.exp.exponent
name: "Mensajes: bandeja de conversaciones"
tags:
  - mensajes
---
- runFlow: ../_comun/abrir-app.yaml
- runFlow: ../_comun/iniciar-sesion.yaml
- runFlow:
    file: ../_comun/ir-a-pestana.yaml
    env:
      PESTANA: Mensajes

# Cada fila es UN elemento accesible: «Chat con <nombre>. <ultimo mensaje>».
- extendedWaitUntil:
    visible: "Chat con Beto Prueba\\..*"
    timeout: 30000
- assertVisible: "Chat con Taller E2E\\..*"
- assertVisible: "Chat con Carpinteria E2E\\..*"
# Los grupos con temas o comunidades lo anuncian (abren su lista, no el chat).
- assertVisible: "Chat con Taller E2E\\..*Comunidad con temas y grupos\\."
- assertVisible: "Buscar por nombre o usuario"
- assertVisible: "Crear una comunidad"
- takeScreenshot: mensajes-bandeja

# ---- Buscar --------------------------------------------------------------
# Textos CORTOS y la «x» del campo en vez de `eraseText`: en este campo
# teclear va muy lento en el emulador (~10 s por letra frente a <1 s en otros
# campos) y `eraseText` llego a quedarse colgado 4 min (ver hallazgos).
- tapOn: "Buscar por nombre o usuario"
- inputText: "Carp"
- hideKeyboard
- extendedWaitUntil:
    notVisible: "Chat con Beto Prueba\\..*"
    timeout: 15000
- assertVisible: "Chat con Carpinteria E2E\\..*"
- assertNotVisible: "Chat con Taller E2E\\..*"

# Borrar la busqueda devuelve la bandeja entera.
- tapOn: "Borrar la búsqueda"
- extendedWaitUntil:
    visible: "Chat con Beto Prueba\\..*"
    timeout: 15000
- assertVisible: "Chat con Taller E2E\\..*"

# La busqueda SIN resultados (hallazgo M11, ya corregido) va en
# busqueda-sin-resultados.yaml.
