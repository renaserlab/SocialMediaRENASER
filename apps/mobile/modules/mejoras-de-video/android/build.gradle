// «Mejorar» del directo: un complemento de video propio (piel suave, luz,
// contraste, nitidez y rubor) que retoca la cámara en la GPU, enganchado a la
// MISMA instancia del SDK de 100ms que usa la sala. Solo Android: en iOS este
// módulo no existe (`expo-module.config.json`).
//
// EL SDK DE 100ms VA EN LA MISMA VERSIÓN QUE EL DE `react-native-hms` 1.12.3
// (`sdk-versions.json`: 2.9.84): de él salen la interfaz de los complementos y
// las clases de WebRTC con que se pinta. Si se sube `react-native-hms`, se sube
// aquí; `mejorasCableado.test.mts` falla si se separan.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mejorasdevideo'
version = '1.0.0'

android {
  namespace "expo.modules.mejorasdevideo"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // `HMSManager.hmsCollection`: donde el puente de React Native guarda cada
  // `HMSSDK` por su identificador. Es como lo encuentra también el complemento
  // de fondos de 100ms (`@100mslive/react-native-video-plugin`).
  implementation project(':100mslive_react-native-hms')
  implementation 'live.100ms:android-sdk:2.9.84'
}
