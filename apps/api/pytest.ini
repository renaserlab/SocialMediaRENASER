[pytest]
# POR QUE EXISTE ESTE FICHERO. `pytest` a secas NO pone el directorio actual en
# `sys.path`; `python -m pytest` si. Como en local se lanza con `-m` y en CI se
# lanzaba `pytest` a pelo, la suite pasaba aqui y fallaba alli con
# `ModuleNotFoundError: No module named 'app'`. CI llevaba roto desde el 21 de
# agosto por eso, y el despliegue a AWS —que corre las pruebas antes de
# publicar la imagen— no llegaba a arrancar.
#
# `pythonpath` lo arregla en los dos sitios a la vez, que es mejor que
# acordarse de escribir `-m` en cada sitio nuevo donde se llame a las pruebas.
pythonpath = .
testpaths = tests
