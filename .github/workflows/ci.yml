name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: npm run mobile:check
      # Y LAS PRUEBAS. `mobile:check` es `tsc --noEmit`: comprueba TIPOS, no
      # comportamiento. Las 113 baterias del movil —los contratos con la API,
      # las reglas de cada pantalla, la paridad de los tres diccionarios— no se
      # ejecutaban en ningun sitio, asi que un cambio que rompiera la pantalla
      # de preparar un pedido o dejara una clave sin traducir pasaba en verde.
      # Tardan cuatro segundos.
      - run: npm run mobile:test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      # psycopg NO es una dependencia de la aplicacion —la API habla con la base
      # por asyncpg— sino del ARNES de las migraciones, que abre la base
      # desechable con el. Seis ficheros de pruebas lo importan arriba del todo,
      # asi que sin el aqui la recoleccion revienta y trece ficheros no llegan a
      # ejecutarse: no es que fallen, es que no se recogen. Los casos que
      # necesitan PostgreSQL se siguen saltando por MIGRACIONES_DATABASE_URL,
      # que aqui no esta puesta a proposito; lo que hace falta es poder
      # RECOGERLOS. El trabajo de migraciones lo instala por lo mismo.
      - run: pip install 'psycopg[binary]'
      - run: pytest

  # Las migraciones, EJECUTADAS. La suite de arriba construye el esquema desde
  # los modelos, asi que un SQL invalido, un indice parcial mal escrito o una
  # politica RLS rota pasarian en verde y solo darian la cara al pegarlos en el
  # editor de Supabase, que es donde se aplican a mano.
  #
  # La base es un contenedor efimero del propio runner: sin credenciales, sin
  # red hacia fuera y se destruye al terminar. La variable se llama
  # MIGRACIONES_DATABASE_URL y NO DATABASE_URL a proposito, porque la prueba
  # borra y recrea el esquema `public`.
  migraciones:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: renaser_migraciones
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRACIONES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renaser_migraciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install 'psycopg[binary]'
      # `-p no:randomly` NO se usa: el orden aleatorio es parte de lo que
      # se comprueba. Lo que si importa es que estas pruebas NO se omitan;
      # `--strict-markers` no lo garantiza, asi que la linea siguiente lo
      # comprueba de verdad: si alguna se salta, el job falla.
      # LAS DE PRODUCTOS TAMBIEN, y por eso estan aqui y no arriba: la
      # verificacion de la compra del Incremento 8 y el dinero del
      # Incremento 9 viven en claves ajenas compuestas, indices unicos
      # parciales y disparadores, que SQLite no impone. En el trabajo
      # principal se saltaban 92 de 100 y la integracion seguia verde.
      # LA BATERIA ENTERA, Y NO UNA LISTA DE FICHEROS.
      #
      # Aqui habia una lista escrita a mano, y una lista escrita a mano se
      # queda vieja sola: un fichero nuevo que necesite la base no falla y no
      # se salta con un aviso, sencillamente NO SE RECOGE, y la integracion
      # sigue verde. Ya paso dos veces. La primera dejo fuera 92 de las 100
      # pruebas de Productos de los Incrementos 8 y 9. Se corrigio anadiendolos
      # (5cd6d28) y la lista volvio a quedarse vieja en la misma sesion: veinte
      # ficheros se quedaron fuera, entre ellos los Incrementos 1 a 7 enteros y
      # `test_productos_disputas.py`, que protege la unica puerta por la que se
      # registra un contracargo.
      #
      # Ejecutar todo no se puede olvidar de nada. Cuesta unos minutos mas de
      # maquina y ahorra dar por cerrado un incremento cuya verificacion no
      # existia. `tests/test_integracion_continua.py` vigila que no vuelva a
      # aparecer una lista incompleta aqui.
      - run: pytest -q --junitxml=migraciones.xml
      # Una prueba OMITIDA no es una prueba aprobada. Sin esto, borrar la
      # variable de entorno dejaria el job en verde sin ejecutar nada.
      - name: Ninguna prueba de PostgreSQL puede quedar omitida
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse('migraciones.xml').getroot()
          total = int(suite.get('tests') or suite[0].get('tests'))
          saltadas = int(suite.get('skipped') or suite[0].get('skipped'))
          print(f'{total} pruebas, {saltadas} omitidas')
          if saltadas:
              sys.exit('hay pruebas de PostgreSQL omitidas: omitida no es aprobada')
          # SUELO MEDIDO, no supuesto: la bateria entera con PostgreSQL da
          # 3324 casos (22/09/2026, 11 min 55 s). El suelo va algo por debajo
          # para que anadir o quitar un par de casos no tumbe la integracion,
          # y lo bastante alto para que acotar la seleccion por error si.
          if total < 3300:
              sys.exit(f'solo se ejecutaron {total}: falta alguna suite')
          PY
