name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: npm run mobile:check

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      # psycopg NO es una dependencia de la aplicacion —la API habla con la base
      # por asyncpg— sino del ARNES de las migraciones, que abre la base
      # desechable con el. Seis ficheros de pruebas lo importan arriba del todo,
      # asi que sin el aqui la recoleccion revienta y trece ficheros no llegan a
      # ejecutarse: no es que fallen, es que no se recogen. Los casos que
      # necesitan PostgreSQL se siguen saltando por MIGRACIONES_DATABASE_URL,
      # que aqui no esta puesta a proposito; lo que hace falta es poder
      # RECOGERLOS. El trabajo de migraciones lo instala por lo mismo.
      - run: pip install 'psycopg[binary]'
      - run: pytest

  # Las migraciones, EJECUTADAS. La suite de arriba construye el esquema desde
  # los modelos, asi que un SQL invalido, un indice parcial mal escrito o una
  # politica RLS rota pasarian en verde y solo darian la cara al pegarlos en el
  # editor de Supabase, que es donde se aplican a mano.
  #
  # La base es un contenedor efimero del propio runner: sin credenciales, sin
  # red hacia fuera y se destruye al terminar. La variable se llama
  # MIGRACIONES_DATABASE_URL y NO DATABASE_URL a proposito, porque la prueba
  # borra y recrea el esquema `public`.
  migraciones:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: renaser_migraciones
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRACIONES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renaser_migraciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install 'psycopg[binary]'
      # `-p no:randomly` NO se usa: el orden aleatorio es parte de lo que
      # se comprueba. Lo que si importa es que estas pruebas NO se omitan;
      # `--strict-markers` no lo garantiza, asi que la linea siguiente lo
      # comprueba de verdad: si alguna se salta, el job falla.
      - run: pytest -v tests/test_migraciones_reales.py tests/test_secuencia_de_migraciones.py tests/test_migraciones_de_aprendizaje.py tests/test_migraciones_de_eventos.py tests/test_aforo_concurrente_postgres.py tests/test_entradas_concurrentes_postgres.py --junitxml=migraciones.xml
      # Una prueba OMITIDA no es una prueba aprobada. Sin esto, borrar la
      # variable de entorno dejaria el job en verde sin ejecutar nada.
      - name: Ninguna prueba de PostgreSQL puede quedar omitida
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse('migraciones.xml').getroot()
          total = int(suite.get('tests') or suite[0].get('tests'))
          saltadas = int(suite.get('skipped') or suite[0].get('skipped'))
          print(f'{total} pruebas, {saltadas} omitidas')
          if saltadas:
              sys.exit('hay pruebas de PostgreSQL omitidas: omitida no es aprobada')
          if total < 100:
              sys.exit(f'solo se ejecutaron {total}: falta alguna suite')
          PY
