# =============================================================================
# Despliegue de la API en AWS — sin claves permanentes
# =============================================================================
#
# Publica la imagen de apps/api en ECR, apunta el parametro de SSM a la version
# nueva y renueva las maquinas del grupo de autoescalado.
#
# NO TOCA CLOUDFORMATION. Es deliberado: el rol que asume este workflow solo
# puede subir imagenes, mover un parametro y renovar instancias. Cambiar la
# infraestructura (red, balanceador, IAM) lo hace una persona con permisos de
# administrador, a mano y mirando el changeset. Un CI que puede reescribir la
# infraestructura es un CI que puede borrarla.
#
# CI (ci.yml) sigue siendo quien valida cada pull request; aqui se vuelven a
# lanzar los tests a proposito, porque un push a `main` no espera a ci.yml y sin
# esta comprobacion se podria publicar una imagen con los tests en rojo. SALVO
# que ese mismo codigo, fichero a fichero, ya la haya pasado entera en ci.yml:
# entonces repetirla no prueba nada nuevo (ver el paso «Buscar la huella»).
#
# VOLVER ATRAS: Actions > este workflow > "Run workflow" y escribir en
# `etiqueta_para_volver_atras` una etiqueta que ya este en ECR (por ejemplo
# sha-a1b2c3d). No construye nada: solo repunta y renueva. Unos 3 minutos.
# =============================================================================

name: Desplegar API en AWS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/desplegar-aws.yml'
  workflow_dispatch:
    inputs:
      etiqueta_para_volver_atras:
        description: 'Etiqueta YA publicada en ECR a la que volver (ej. sha-a1b2c3d). Vacio = desplegar el commit actual.'
        required: false
        default: ''

permissions:
  # id-token es lo que permite a GitHub pedir un token OIDC y cambiarlo por
  # credenciales temporales de AWS. Sin esta linea, no hay despliegue.
  id-token: write
  contents: read

concurrency:
  group: desplegar-aws-produccion
  # NUNCA cancelar a mitad: un despliegue interrumpido puede dejar el grupo con
  # instancias a medio reemplazar. Que el segundo espere.
  cancel-in-progress: false

# A QUE CUENTA SE DESPLIEGA lo deciden las variables del repositorio, no este
# fichero. Mudar la API de cuenta de AWS es cambiar tres variables en GitHub
# (AWS_ROLE_ARN, AWS_PILA_PLATAFORMA y AWS_REPOSITORIO_ECR), no editar el
# flujo. Ver docs/AWS_MIGRACION_RENASERLAB.md.
#
# Los valores por defecto son los de RenaserLab, donde corre produccion desde
# el 23/09/2026. Antes eran `renaser-plataforma-produccion` y `renaser/api`, de
# la cuenta de Ricardo, que se dio de baja: si alguien borrara las variables,
# el flujo iria a buscar nombres que ya no existen en ninguna cuenta nuestra y,
# en RenaserLab, `renaser-*` es el prefijo de OTROS productos.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PILA_PLATAFORMA: ${{ vars.AWS_PILA_PLATAFORMA || 'zexcelencia-plataforma-produccion' }}
  REPOSITORIO_ECR: ${{ vars.AWS_REPOSITORIO_ECR || 'zexcelencia/api' }}

jobs:

  # ---------------------------------------------------------------------------
  pruebas:
    name: Tests de la API
    runs-on: ubuntu-latest
    # En un rollback no se ejecutan: esa imagen ya paso por aqui cuando se
    # publico, y volver atras rapido es justamente el objetivo.
    if: ${{ inputs.etiqueta_para_volver_atras == '' }}
    # `actions: read` para buscar la huella de ci.yml (abajo). Los permisos de
    # un trabajo SUSTITUYEN a los del flujo, asi que se repite `contents`.
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: apps/api
    # CON POSTGRESQL, Y NO SIN EL. Sin base, las pruebas que verifican lo que
    # solo PostgreSQL impone —claves ajenas compuestas, indices unicos
    # parciales, disparadores, RLS— se OMITEN, pytest sale con 0 y se publica
    # la imagen: 416 pruebas saltadas en silencio a la puerta de produccion.
    # En `ci.yml` ese hueco lo tapa el trabajo `migraciones`; aqui no habia
    # nada detras, porque un push a `main` no espera a la integracion continua.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: renaser_migraciones
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRACIONES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renaser_migraciones
    steps:
      - uses: actions/checkout@v4
      # ¿ESTE MISMO CODIGO YA PASO LA BATERIA ENTERA? Al fusionar un PR al dia
      # con `main`, el codigo que llega aqui es identico, fichero a fichero, al
      # que el trabajo `migraciones` de ci.yml ya probo en el PR: repetirlo eran
      # 43 minutos para el mismo resultado. Se compara el ARBOL (el contenido
      # exacto), no el commit, porque al fusionar el commit cambia y el
      # contenido no. Si no hay huella de ESE arbol —un push directo a `main`,
      # un PR que no estaba al dia, una huella caducada— se ejecuta todo, como
      # siempre: ante la duda, la bateria.
      - name: Buscar la huella de ci.yml para este codigo
        id: huella
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARBOL=$(git rev-parse 'HEAD^{tree}')
          # Si la API de GitHub falla, no hay huella: se ejecuta todo.
          EJECUCION=$(gh api "repos/$REPO/actions/artifacts?name=bateria-completa-$ARBOL" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty' || true)
          PROBADA=false
          if [ -n "$EJECUCION" ]; then
            FLUJO=$(gh api "repos/$REPO/actions/runs/$EJECUCION" --jq .path || true)
            # Solo vale la de ci.yml: es la que ejecuta la bateria entera con el
            # mismo guardia que este trabajo.
            if [ "$FLUJO" = ".github/workflows/ci.yml" ]; then PROBADA=true; fi
          fi
          echo "probada=$PROBADA" >> "$GITHUB_OUTPUT"
          if [ "$PROBADA" = true ]; then
            echo "- Bateria: ya la paso este mismo codigo (arbol \`$ARBOL\`) en ci.yml, ejecucion $EJECUCION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Bateria: sin huella del arbol \`$ARBOL\`; se ejecuta entera" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.huella.outputs.probada != 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        if: steps.huella.outputs.probada != 'true'
      # psycopg NO es dependencia de la aplicacion —la API habla con la base por
      # asyncpg— sino del ARNES de las migraciones. Diecisiete ficheros de
      # pruebas lo importan arriba del todo, asi que sin el aqui la RECOLECCION
      # revienta y este trabajo termina en rojo sin que el mensaje hable de
      # pruebas.
      #
      # ESTUVO ROTO DESDE EL INCREMENTO 4, y no se vio porque no se ha fusionado
      # nada a `main` desde entonces: el despliegue a produccion llevaba semanas
      # bloqueado. `ci.yml` lo corrigio en sus dos trabajos y esta copia se
      # quedo fuera. Ahora lo vigila `tests/test_integracion_continua.py`, que
      # mira TODOS los flujos y no una lista.
      - run: pip install 'psycopg[binary]'
        if: steps.huella.outputs.probada != 'true'
      # ffmpeg, igual que en ci.yml: la imagen de produccion lo trae y las
      # pruebas del poster lo usan. Sin el se omiten y la guardia tumba el
      # despliegue (paso el 21-11-2026 con el poster sin fotograma negro).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        if: steps.huella.outputs.probada != 'true'
      - run: pytest -q --junitxml=despliegue.xml
        if: steps.huella.outputs.probada != 'true'
      # EL MISMO GUARDIA QUE LA INTEGRACION CONTINUA, y es el mismo guion a
      # proposito: duplicarlo aqui es como se quedo viejo lo de psycopg.
      - name: Ninguna prueba puede quedar omitida ni faltar antes de publicar
        if: steps.huella.outputs.probada != 'true'
        run: python scripts/exigir_bateria_completa.py despliegue.xml

  # ---------------------------------------------------------------------------
  publicar:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: pruebas
    if: ${{ inputs.etiqueta_para_volver_atras == '' }}
    outputs:
      etiqueta: ${{ steps.version.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular etiqueta
        id: version
        # El SHA del commit y no un numero incremental: dada una etiqueta en
        # produccion siempre se puede ir al codigo exacto que la genero.
        run: echo "etiqueta=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Variable de repositorio (Settings > Variables), no secreto: un ARN
          # no abre nada sin un token OIDC del repositorio autorizado.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-publicar-${{ github.run_id }}

      - name: Entrar en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # UNA ETIQUETA NO SE VUELVE A SUBIR. En el repositorio de RenaserLab las
      # etiquetas son inmutables: `sha-<commit>` apunta para siempre a la misma
      # imagen. Relanzar un despliegue del mismo commit (porque fallo la
      # renovacion, no la construccion) chocaria con la etiqueta ya publicada;
      # como es el mismo commit, es la misma imagen, y se reutiliza.
      - name: Comprobar si esta version ya esta publicada
        id: publicada
        env:
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORIO_ECR" \
               --image-ids imageTag="$ETIQUETA" > /dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "$ETIQUETA ya esta en ECR: no se reconstruye."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.publicada.outputs.existe != 'true'

      - name: Construir y subir
        if: steps.publicada.outputs.existe != 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          # SOLO la etiqueta del commit. `latest` existia como red para una
          # maquina que arrancase con el parametro de SSM sin tocar; hoy la
          # plantilla exige una etiqueta `sha-` al crear la pila, asi que no la
          # lee nadie, y una etiqueta que se mueve no dice que codigo corre.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORIO_ECR }}:${{ steps.version.outputs.etiqueta }}
          provenance: false
          # Cache entre ejecuciones: la capa de pip install es la cara y solo
          # cambia cuando cambia requirements.txt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El resumen del despliegue deja escrito el DIGEST, que es lo unico que
      # identifica una imagen sin depender de que nadie haya movido una etiqueta.
      - name: Anotar la huella de la imagen
        env:
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORIO_ECR" \
            --image-ids imageTag="$ETIQUETA" --query 'imageDetails[0].imageDigest' --output text)
          echo "- Imagen: \`$REPOSITORIO_ECR:$ETIQUETA\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  desplegar:
    name: Renovar instancias
    runs-on: ubuntu-latest
    needs: [pruebas, publicar]
    # Tiene que correr tambien cuando `pruebas` y `publicar` se saltan (rollback).
    if: >-
      ${{ !cancelled()
          && needs.pruebas.result != 'failure'
          && needs.publicar.result != 'failure' }}
    steps:

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-desplegar-${{ github.run_id }}

      - name: Leer datos de la pila
        id: pila
        run: |
          set -euo pipefail
          leer() {
            aws cloudformation describe-stacks \
              --stack-name "$PILA_PLATAFORMA" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          {
            echo "grupo=$(leer NombreDelGrupoDeAutoescalado)"
            echo "parametro=$(leer ParametroDeLaVersion)"
            echo "url=$(leer UrlDeLaApi)"
          } >> "$GITHUB_OUTPUT"

          # A DONDE SE LE PREGUNTA A LA API SI ESTA VIVA. No al balanceador.
          #
          # Cuando `EsSoloDesdeCloudFront` esta activo, el grupo de seguridad
          # del balanceador solo admite la lista de prefijos de CloudFront: un
          # runner de GitHub NO puede entrar y `curl` agota el tiempo. Eso es
          # exactamente lo que tumbo los despliegues del 31 de agosto y del 1 de
          # septiembre: imagen publicada, maquinas renovadas, prueba de humo
          # imposible y vuelta atras. La API de produccion se quedo congelada en
          # `sha-38f829c` mientras la web ya pedia rutas que esa version no
          # tenia, y de ahi los 404 de `/conversations/labels`.
          #
          # CloudFront es ademas el punto de entrada DE VERDAD: es la URL que
          # usa la aplicacion, asi que comprobarla prueba mas que el balanceador.
          # Y no falsea nada, porque la distribucion lleva la politica
          # administrada CachingDisabled y cada peticion baja al origen.
          #
          # Si no hay frente HTTPS, no hay CloudFront al que preguntar y el
          # balanceador SI es la entrada real: entonces se usa esa.
          FRENTE=$(leer UrlHttpsDeEmergencia)
          case "$FRENTE" in
            ''|None) FRENTE=$(leer UrlDeLaApi) ;;
          esac
          echo "url_de_humo=$FRENTE" >> "$GITHUB_OUTPUT"
          echo "Se comprobara la salud en: $FRENTE"

      - name: Decidir que version se despliega
        id: destino
        env:
          ETIQUETA_MANUAL: ${{ inputs.etiqueta_para_volver_atras }}
          ETIQUETA_NUEVA: ${{ needs.publicar.outputs.etiqueta }}
          PARAMETRO: ${{ steps.pila.outputs.parametro }}
        run: |
          set -euo pipefail
          ETIQUETA="${ETIQUETA_MANUAL:-$ETIQUETA_NUEVA}"
          if [ -z "$ETIQUETA" ]; then
            echo "No hay ninguna etiqueta que desplegar." >&2
            exit 1
          fi

          # Antes de tocar nada se guarda la version que hay AHORA. Es lo que se
          # restaura si el despliegue sale mal; sin este dato, un fallo dejaria
          # la produccion apuntando a una imagen rota y a nadie sabiendo a que
          # volver.
          ANTERIOR=$(aws ssm get-parameter --name "$PARAMETRO" \
            --query 'Parameter.Value' --output text)

          # En un rollback se comprueba que la etiqueta EXISTE antes de apuntar
          # a ella: si no, las maquinas nuevas no arrancarian y el "arreglo"
          # seria peor que el problema.
          if [ -n "$ETIQUETA_MANUAL" ]; then
            aws ecr describe-images \
              --repository-name "$REPOSITORIO_ECR" \
              --image-ids imageTag="$ETIQUETA" > /dev/null
            echo "Volviendo atras a $ETIQUETA (ahora mismo corre $ANTERIOR)"
          fi

          {
            echo "etiqueta=$ETIQUETA"
            echo "anterior=$ANTERIOR"
          } >> "$GITHUB_OUTPUT"

      - name: Apuntar a la version nueva y renovar
        id: renovar
        env:
          GRUPO: ${{ steps.pila.outputs.grupo }}
          PARAMETRO: ${{ steps.pila.outputs.parametro }}
          ETIQUETA: ${{ steps.destino.outputs.etiqueta }}
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "$PARAMETRO" --type String \
            --value "$ETIQUETA" --overwrite > /dev/null
          echo "Parametro $PARAMETRO -> $ETIQUETA"

          # MinHealthyPercentage=100 Y MaxHealthyPercentage=200. Con solo el
          # minimo, AWS TERMINA primero y lanza despues: medido en RenaserLab el
          # 23/09/2026, tres minutos sin ninguna maquina sana con una instancia.
          # El maximo por encima de 100 es lo que le deja lanzar antes.
          #
          # Asi: primero levanta la maquina nueva y solo
          # cuando pasa el health check apaga la vieja. Con una imagen rota, la
          # nueva nunca llega a estar sana, la renovacion falla y la version
          # anterior SIGUE SIRVIENDO. Esta es la razon de que los dos perfiles
          # tengan max = deseadas + 1: sin ese hueco, AWS tendria que apagar
          # antes de encender.
          #
          # AutoRollback se deja en false a proposito: la version vive en SSM,
          # no en la plantilla de arranque, asi que el rollback automatico de
          # AWS volveria a la MISMA plantilla, que releeria el mismo parametro y
          # traeria otra vez la imagen rota. El paso "Volver atras" de mas abajo
          # si hace lo correcto: devolver el parametro a la version anterior.
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$GRUPO" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300,"AutoRollback":false,"ScaleInProtectedInstances":"Ignore","StandbyInstances":"Ignore"}' \
            --query InstanceRefreshId --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Renovacion $ID en marcha"

      - name: Esperar a que terminen las maquinas
        env:
          GRUPO: ${{ steps.pila.outputs.grupo }}
          ID: ${{ steps.renovar.outputs.id }}
        # 25 min: reemplazar 2 maquinas con 5 min de margen de arranque cada una
        # cabe de sobra. Si se pasa de aqui, algo esta atascado.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          while true; do
            LEIDO=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$GRUPO" --instance-refresh-ids "$ID" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' \
              --output text)
            ESTADO=$(echo "$LEIDO" | cut -f1)
            PORCENTAJE=$(echo "$LEIDO" | cut -f2)
            echo "  $ESTADO ($PORCENTAJE%)"
            case "$ESTADO" in
              Successful)
                echo "Maquinas renovadas."; exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "::error::La renovacion termino en $ESTADO: $(echo "$LEIDO" | cut -f3)"
                exit 1 ;;
            esac
            sleep 20
          done

      - name: Prueba de humo contra la API publica
        env:
          URL: ${{ steps.pila.outputs.url_de_humo }}
        run: |
          set -euo pipefail
          # Se comprueba el CONTENIDO, no solo el codigo 200: un balanceador
          # puede devolver 200 desde una pagina de error intermedia.
          RESPUESTA=$(curl -fsS --max-time 10 -w '\n%{time_total}' "$URL/health")
          CUERPO=$(echo "$RESPUESTA" | head -n1)
          SEGUNDOS=$(echo "$RESPUESTA" | tail -n1)
          echo "$CUERPO (en ${SEGUNDOS}s)"
          echo "$CUERPO" | grep -q '"status":"ok"'
          {
            echo "### API desplegada"
            echo ""
            echo "- Version: \`${{ steps.destino.outputs.etiqueta }}\`"
            echo "- URL: $URL"
            echo "- /health: ${SEGUNDOS}s"
            echo ""
            echo "Referencia: en Render plan Free el primer acceso tras inactividad tardaba 21,77 s."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Volver atras
        # Salta si falla CUALQUIER paso anterior, incluida la prueba de humo:
        # una renovacion "correcta" que deja la API respondiendo mal tambien es
        # un despliegue fallido.
        if: failure() && steps.destino.outputs.anterior != ''
        env:
          GRUPO: ${{ steps.pila.outputs.grupo }}
          PARAMETRO: ${{ steps.pila.outputs.parametro }}
          ANTERIOR: ${{ steps.destino.outputs.anterior }}
          ETIQUETA: ${{ steps.destino.outputs.etiqueta }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ "$ANTERIOR" = "$ETIQUETA" ]; then
            echo "La version anterior y la nueva son la misma; no hay a donde volver."
            exit 1
          fi
          echo "::warning::Despliegue fallido. Devolviendo produccion a $ANTERIOR"

          # Si quedo una renovacion en curso hay que cancelarla: AWS no admite
          # dos a la vez sobre el mismo grupo.
          EN_CURSO=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$GRUPO" \
            --query "InstanceRefreshes[?Status=='InProgress'||Status=='Pending'||Status=='Cancelling'].InstanceRefreshId" \
            --output text)
          if [ -n "$EN_CURSO" ]; then
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$GRUPO" > /dev/null || true
            for _ in $(seq 1 60); do
              PENDIENTE=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$GRUPO" \
                --query "InstanceRefreshes[?Status=='InProgress'||Status=='Pending'||Status=='Cancelling'] | length(@)" \
                --output text)
              [ "$PENDIENTE" = "0" ] && break
              sleep 10
            done
          fi

          aws ssm put-parameter --name "$PARAMETRO" --type String \
            --value "$ANTERIOR" --overwrite > /dev/null

          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$GRUPO" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300,"AutoRollback":false,"ScaleInProtectedInstances":"Ignore","StandbyInstances":"Ignore"}' \
            --query InstanceRefreshId --output text)

          while true; do
            ESTADO=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$GRUPO" --instance-refresh-ids "$ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "  vuelta atras: $ESTADO"
            case "$ESTADO" in
              Successful) break ;;
              Failed|Cancelled|RollbackFailed)
                echo "::error::No se pudo volver atras automaticamente. Ver el procedimiento manual en docs/AWS_DESPLIEGUE.md"
                exit 1 ;;
            esac
            sleep 20
          done

          {
            echo "### Despliegue revertido"
            echo ""
            echo "- Version que fallo: \`$ETIQUETA\`"
            echo "- Version restaurada: \`$ANTERIOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Se sale en error igualmente: la produccion esta sana, pero el
          # despliegue NO salio bien y eso tiene que verse en rojo.
          exit 1
