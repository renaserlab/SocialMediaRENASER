# Blueprint de Render para el backend FastAPI (Z).
# En Render: New > Blueprint > conecta este repo > usa la rama main.
# Los valores marcados como sync:false se configuran en el dashboard (secretos).

services:
  - type: web
    name: renaser-api
    runtime: docker
    repo: https://github.com/renaserlab/SocialMediaRENASER
    # Despliega desde `main`, la misma rama de la que Vercel publica la web.
    #
    # Antes escuchaba `Edson`. Eso ataba el backend de produccion a la rama de
    # trabajo de una persona: cualquier cosa a medias en esa rama salia al
    # servidor, y a la vez lo que ya estaba aprobado en `main` no llegaba nunca.
    # Con las dos partes del producto saliendo de `main`, la web y la API van
    # siempre a la par y hay un solo sitio que mirar para saber que esta
    # publicado.
    #
    # OJO: este fichero NO cambia por si solo un servicio que ya existe. Render
    # solo lo aplica al sincronizar el Blueprint; mientras no se haga, manda lo
    # que ponga el panel. Si el servicio sigue escuchando otra rama, hay que
    # cambiarlo alli a mano (Settings > Build & Deploy > Branch).
    branch: main
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    # El plan gratuito DUERME tras un rato sin trafico y tarda en despertar. Para
    # el dia a dia vale; antes de mandar la app a revision hay que subirlo, o
    # quien revise se encontrara la app sin datos y la leera como rota. Se deja
    # en `free` a proposito: cambiarlo aqui empieza a cobrar en cuanto se
    # sincronice el Blueprint, y esa es una decision de negocio.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: RENASER Social Media API
      - key: ENVIRONMENT
        value: production
      # El comodin NO abre la API: en produccion `cors_origin_list` lo descarta
      # y usa los dominios propios (DEFAULT_PRODUCTION_ORIGINS). Se deja asi
      # para que en local siga siendo permisivo. Al tener dominio propio, hay
      # que ponerlo aqui separado por comas: esa lista sustituye a la de
      # por defecto.
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_JWT_ALGORITHM
        value: HS256
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # Portal de pagos: APAGADO. Ya es el valor por defecto en config.py, pero
      # se declara aqui para que el estado quede a la vista de quien mire el
      # servidor. Encenderlo sin una pasarela real implementada deja un cobro
      # que no se completa, y eso es rechazo directo en las dos tiendas.
      - key: PAYMENTS_ENABLED
        value: "false"
      # A donde vuelve la persona al terminar el pago. Es una pagina de la WEB,
      # no de la app: cobrar dentro de la aplicacion obliga a usar las compras
      # integradas de Apple y Google, con su comision.
      - key: PAYMENTS_RETURN_URL
        value: https://social-media-renaser.vercel.app/pago
      # Personalizacion (cuestionario de intereses, "Personas para ti" y el
      # orden de "Para ti"). ENCENDIDA. Se declara aqui para que el interruptor
      # este a la vista: ponerlo en "false" desde el dashboard devuelve la
      # aplicacion al feed cronologico al instante, sin desplegar nada y sin
      # borrar una sola fila. Es el plan de vuelta atras de esta fase.
      - key: FEATURE_RECOMMENDATIONS_V1
        value: "true"
      # --- Secretos: configúralos en el dashboard de Render ---
      # DATABASE_URL: postgresql+asyncpg://postgres.<ref>:<PWD_%23>@aws-0-us-east-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # SUPABASE_URL: https://<ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # SUPABASE_ANON_KEY: publishable key
      - key: SUPABASE_ANON_KEY
        sync: false
      # SUPABASE_JWT_SECRET: (opcional si tu proyecto usa ES256/JWKS; con SUPABASE_URL basta)
      - key: SUPABASE_JWT_SECRET
        sync: false
      # SUPABASE_SERVICE_ROLE_KEY: sb_secret_... (solo backend)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
