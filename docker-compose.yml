services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: renaser
      POSTGRES_USER: renaser
      POSTGRES_PASSWORD: renaser_local
    ports:
      - "5432:5432"
    volumes:
      - renaser_pg_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://renaser:renaser_local@postgres:5432/renaser
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  renaser_pg_data:
